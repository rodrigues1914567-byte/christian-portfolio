<title>Christian Rodrigues Leite | Links</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;background:#080b12}
body{min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#f4f7fa;background:radial-gradient(circle at 50% -10%,rgba(59,130,246,.16),transparent 35%),#080b12;display:flex;justify-content:center;padding:32px 16px 28px}
.page{width:100%;max-width:520px;text-align:center}
.profile{padding:12px 8px 24px}
.photo{width:112px;height:112px;object-fit:cover;border-radius:50%;display:block;margin:0 auto 18px;border:3px solid rgba(96,165,250,.85);box-shadow:0 0 0 7px rgba(59,130,246,.08),0 16px 45px rgba(0,0,0,.35)}
h1{font-size:clamp(28px,7vw,38px);line-height:1.08;letter-spacing:-.7px;margin-bottom:9px}
.subtitle{color:#a7b2c0;font-size:15px;line-height:1.5;letter-spacing:.2px}
.socials{display:flex;justify-content:center;gap:10px;margin:20px 0 26px;flex-wrap:wrap}
.social{min-width:46px;height:46px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid #26364a;border-radius:999px;color:#dbe5ef;background:#101722;text-decoration:none;font-size:13px;font-weight:650;transition:.2s ease}
.social:hover{transform:translateY(-2px);border-color:#3b82f6;background:#132033;color:#fff}
.links{display:grid;gap:12px}
.link{min-height:68px;display:flex;align-items:center;justify-content:center;padding:16px 20px;position:relative;overflow:hidden;border:1px solid #26364a;border-radius:16px;color:#f4f7fa;background:rgba(16,23,34,.94);text-decoration:none;font-size:16px;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.16);transition:transform .2s ease,border-color .2s ease,background .2s ease}
.link:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#3b82f6;opacity:.9}
.link:hover{transform:translateY(-2px);border-color:#3b82f6;background:#111d2d}
.link.primary{background:linear-gradient(135deg,#16345f,#10243f);border-color:#315f9e}
.link.primary:before{background:#60a5fa}
.link small{display:block;margin-top:4px;color:#a7b2c0;font-weight:500;font-size:12px}
.link-content{display:flex;flex-direction:column;align-items:center;gap:2px}
footer{margin-top:30px;color:#718096;font-size:12px}
@media(max-width:420px){body{padding:24px 14px 22px}.photo{width:100px;height:100px}.link{min-height:64px}}
</style>
